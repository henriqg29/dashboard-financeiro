<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanControl | Cadastro</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <header class="login-brand">
                <div class="brand-icon">F</div>
                <h1>Finan<span>Control</span></h1>
            </header>

            <div class="login-header">
                <span class="welcome-label">CRIE SUA CONTA</span>
                <h2>Comece agora!</h2>
                <p>Cadastre-se para começar a organizar suas finanças.</p>
            </div>

            <form class="login-form" id="cadastroForm">
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" placeholder="Digite seu nome" id="nome" required>
                </div>
                <div class="input-group">
                    <label for="emailCadastro">E-mail</label>
                    <input type="email" id="emailCadastro"  placeholder="Digite seu E-mail" required>
                </div>
                <div class="input-group">
                    <label for="senhaCadastro">Senha</label>
                    <input type="password" placeholder="Crie uma senha" id="senhaCadastro" required>
                </div>
                <div class="input-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite sua senha novamente"
                        required>
                </div>
                <button type="submit" class="login-button">Criar minha conta
                    <span>→</span>
                </button>
            </form>

            <div class="register-link">
                <p>
                    Já possui conta?
                    <a href="index.html">Fazer login</a>
                </p>
            </div>
        </section>
        <p class="copyright">
            FinanControl © 2026
        </p>
    </main>
    <script src="cadastro.js"></script>
</body>
</html>
